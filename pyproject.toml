[project]
name = "hackathon-app"
version = "0.1.0"
requires-python = ">=3.12"
# PEP 639: SPDX expression; third-party code and data keep their own terms (README).
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jiwer>=4.0.0",
    "meta-sam-parser>=0.1.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "python-telegram-bot>=22.8",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Agent skill notes are Markdown references, not project source.
extend-exclude = [".agents/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
