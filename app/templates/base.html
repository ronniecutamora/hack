<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reports{% endblock %} · Ulat</title>
  <link rel="icon" href="{{ static_url('favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ static_url('css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body data-live-tokens="{{ live_tokens(request) }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/incidents">
        <span class="brand__mark" aria-hidden="true">U</span>
        <span class="brand__text"><span class="brand__name">Ulat</span><span class="brand__sub">Biñan City DRRM · typhoon and flood reports</span></span>
      </a>
      <nav class="site-nav" aria-label="Officer dashboard">
        <ul>
        {% for href, label in NAV %}
          <li><a href="{{ href }}"{% if nav_current(request.url.path, href) %} aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
        </ul>
      </nav>
      <p class="live" data-live-status data-state="connecting" hidden>
        <span class="live__dot" aria-hidden="true"></span>
        <span data-live-label role="status">Connecting</span>
        <span class="live__updated">· updated <time data-live-updated>{{ render_time() }}</time></span>
      </p>
    </div>
  </header>
  <main id="main" class="page" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ static_url('vendor/htmx-2.0.11/htmx.min.js') }}" defer></script>
  <script src="{{ static_url('js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
