<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reports{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 76rem; padding: 0 1rem; color: #1b1f24; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid #d8dde3; vertical-align: top; }
    th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #57606a; }
    code { font-size: .85rem; }
    .muted { color: #57606a; font-size: .9rem; }
    .empty { padding: 2rem; border: 1px dashed #b6bec7; border-radius: .5rem; text-align: center; }
    .chips { display: flex; flex-wrap: wrap; gap: .3rem; margin: .35rem 0; padding: 0; list-style: none; }
    .chip { background: #eef1f4; border-radius: 1rem; padding: .1rem .55rem; font-size: .82rem; }
    .chip.warn { background: #fff1d6; }
    .chip.alert { background: #ffe1e1; }
    .summary { margin: .25rem 0; }
    .evidence { display: flex; gap: .6rem; align-items: flex-start; margin-bottom: .5rem; }
    .evidence img { width: 11rem; border-radius: .3rem; border: 1px solid #d8dde3; }
    .status-assessed { color: #1a7f37; }
    .status-assessment_failed, .status-transcription_failed { color: #b42318; }
    .status-assessing, .status-new, .status-held { color: #9a6700; }
    .error { color: #b42318; font-size: .85rem; }
    details summary { cursor: pointer; color: #57606a; font-size: .85rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 1rem; }
    .gap { color: #9a6700; font-style: italic; }
    .evidence-refs { margin: .2rem 0; padding-left: 1.1rem; font-size: .88rem; }
    .banner { padding: .6rem .8rem; border-radius: .4rem; margin: .8rem 0; background: #eef1f4; }
    .banner.warn { background: #fff1d6; }
    .banner.ok { background: #dcf5e3; }
    .banner.alert { background: #ffe1e1; }
    form.inline { display: inline; }
    fieldset { border: 1px solid #d8dde3; border-radius: .4rem; margin: .6rem 0; }
    label { display: block; margin: .3rem 0; }
    input[type=text], input[type=datetime-local], textarea { font: inherit; padding: .25rem .4rem; width: min(100%, 28rem); }
    button { font: inherit; padding: .3rem .8rem; cursor: pointer; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    @page { size: A4; margin: 12mm; }
    @media print {
      body { margin: 0; max-width: none; font-size: 10pt; }
      nav, .no-print { display: none !important; }
      a { color: inherit; text-decoration: none; }
      tr, .keep { break-inside: avoid; }
      .chip { border: 1px solid #b6bec7; background: none !important; }
    }
  </style>
</head>
<body>
  <nav aria-label="Officer dashboard"><a href="/incidents">Incidents</a> · <a href="/reports">Reports</a> · <a href="/drafts">Drafts</a> · <a href="/damaged-houses">Damaged houses</a></nav>
  {% block content %}{% endblock %}
</body>
</html>
